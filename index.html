// ── Core helpers (must be defined before Firebase functions) ──────────────────
function dedup(arr){
  const seen=new Set();
  return (arr||[]).filter(x=>{
    if(!x||!x.id) return true;
    const k=String(x.id);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function sortByDate(arr,asc=true){
  return [...(arr||[])].sort((a,b)=>{
    const da=a.date||'';
    const db=b.date||'';
    return asc?da.localeCompare(db):db.localeCompare(da);
  });
}

const calcProject = p => {
  const received = (p.payments||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const expenses = (p.expenses||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const quoted = Number(p.quotedAmount||0);
  return { received, expenses, quoted, profit: received-expenses, balance: quoted-received };

let _db=null;
function getDb(){
  if(_db) return _db;
  // Guard against duplicate app initialization (hot reload etc.)
  if(!firebase.apps||firebase.apps.length===0){
    firebase.initializeApp(FIREBASE_CONFIG);
  }
  _db=firebase.firestore();
  return _db;
}
async function dbGetAll(col){
  const snap=await getDb().collection(col).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function dbBatch(writes){
  const db=getDb();
  for(let i=0;i<writes.length;i+=400){
    const b=db.batch();
    writes.slice(i,i+400).forEach(w=>{
      const ref=db.collection(w.col).doc(w.id);
      if(w.op==='set') b.set(ref,w.data);
    });
    await b.commit();
  }
}
async function loadData(){
  try{
    const [prD,paD,exD,taD,teD,upD,bqD,siD,smD,mtD]=await Promise.all([
      dbGetAll(COLS.projects),dbGetAll(COLS.payments),dbGetAll(COLS.expenses),
      dbGetAll(COLS.tasks),dbGetAll(COLS.team),dbGetAll(COLS.updates),
      dbGetAll(COLS.boq),dbGetAll(COLS.stockItems),dbGetAll(COLS.stockMoves),
      dbGetAll(COLS.meta)
    ]);
    const meta={};
    mtD.forEach(d=>meta[d.id]=d.value);
    const projects=dedup(prD.map(p=>({
      ...p,
      payments:sortByDate(dedup(paD.filter(x=>x.projectId===p.id))),
      expenses:sortByDate(dedup(exD.filter(x=>x.projectId===p.id))),
      updates:sortByDate(dedup(upD.filter(x=>x.projectId===p.id)),false),
      boq:dedup(bqD.filter(x=>x.projectId===p.id)),
    })));
    const team=dedup(teD);
    const tasks=dedup(taD.map(t=>({...t,checklist:t.checklist||[]})));
    const stockItems=dedup(siD);
    const stockMoves=sortByDate(dedup(smD),false);
    return{
      projects,team,tasks,stockItems,stockMoves,
      expenseCats:meta.expenseCats?JSON.parse(meta.expenseCats):[...DEFAULT_EXPENSE_CATS],
      stockCats:meta.stockCats?JSON.parse(meta.stockCats):DEFAULT_STOCK_CATS,
    };
  }catch(e){
    console.error('Load error:',e);
    return{projects:[],team:[],tasks:[],stockItems:[],stockMoves:[],expenseCats:[...DEFAULT_EXPENSE_CATS],stockCats:DEFAULT_STOCK_CATS};
  }
}
async function saveData(d){
  try{
    const w=[];
    dedup(d.projects||[]).forEach(p=>{
      const {payments,expenses,updates,boq,...proj}=p;
      w.push({op:'set',col:COLS.projects,id:p.id,data:proj});
    });
    dedup((d.projects||[]).flatMap(p=>(p.payments||[]).map(x=>({...x,projectId:p.id,projectName:p.name})))).forEach(x=>w.push({op:'set',col:COLS.payments,id:x.id,data:x}));
    dedup((d.projects||[]).flatMap(p=>(p.expenses||[]).map(x=>({...x,projectId:p.id,projectName:p.name})))).forEach(x=>w.push({op:'set',col:COLS.expenses,id:x.id,data:x}));
    dedup((d.projects||[]).flatMap(p=>(p.updates||[]).map(x=>({...x,projectId:p.id,projectName:p.name})))).forEach(x=>w.push({op:'set',col:COLS.updates,id:x.id,data:x}));
    dedup((d.projects||[]).flatMap(p=>(p.boq||[]).map(x=>({...x,projectId:p.id,projectName:p.name})))).forEach(x=>w.push({op:'set',col:COLS.boq,id:x.id,data:x}));
    dedup(d.tasks||[]).forEach(t=>w.push({op:'set',col:COLS.tasks,id:t.id,data:t}));
    dedup(d.team||[]).forEach(m=>w.push({op:'set',col:COLS.team,id:m.id,data:m}));
    dedup(d.stockItems||[]).forEach(i=>w.push({op:'set',col:COLS.stockItems,id:i.id,data:i}));
    dedup(d.stockMoves||[]).forEach(m=>w.push({op:'set',col:COLS.stockMoves,id:m.id,data:m}));
    w.push({op:'set',col:COLS.meta,id:'expenseCats',data:{value:JSON.stringify(d.expenseCats||DEFAULT_EXPENSE_CATS)}});
    w.push({op:'set',col:COLS.meta,id:'stockCats',data:{value:JSON.stringify(d.stockCats||DEFAULT_STOCK_CATS)}});
    await dbBatch(w);
  }catch(e){console.error('Save error:',e);throw e;}
}

function ChecklistEditor({items=[],onChange}){
  const [txt,setTxt]=useState("");
  const add=()=>{if(!txt.trim())return;onChange([...items,{id:uid(),text:txt.trim(),done:false}]);setTxt("");};
  const toggle=(id)=>onChange(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const remove=(id)=>onChange(items.filter(i=>i.id!==id));
  const done=items.filter(i=>i.done).length;
  return <div>
    {items.length>0&&<div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:T.muted,marginBottom:6}}>
        <span>Checklist</span><span style={{color:done===items.length?T.green:T.muted}}>{done}/{items.length} done</span>
      </div>
      <Bar v={done} max={items.length} color={T.green} h={3}/>
      <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
        {items.map(it=><div key={it.id} className="sr" style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:"#F1F5F9",borderRadius:6}}>
          <div onClick={()=>toggle(it.id)} style={{width:16,height:16,borderRadius:4,border:`2px solid ${it.done?T.green:T.border}`,background:it.done?T.green:"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>
            {it.done&&<span style={{color:"#000",fontSize:10,fontWeight:900}}>✓</span>}
          </div>
          <span style={{flex:1,fontSize:13,color:it.done?T.muted:T.text,textDecoration:it.done?"line-through":"none"}}>{it.text}</span>
          <button onClick={()=>remove(it.id)} className="btn" style={{background:"none",border:"none",color:T.faint,fontSize:13}}>✕</button>
        </div>)}
      </div>
    </div>}
    <div style={{display:"flex",gap:8}}>
      <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Add checklist step…" className="inp"
        style={{flex:1,background:"rgba(255,255,255,0.9)",border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13,fontFamily:FF.body}}/>
      <Btn sm onClick={add}>+ Step</Btn>
    </div>
  </div>;
}

      <Btn v="subtle" onClick={onClose}>Cancel</Btn>

        {initial?"Save Changes":"Create Task"}
      </Btn>
    </div>
  </Modal>;
}


function TaskCard({task,team,projects,currentMember,onUpdate,onDelete,onEdit,isOwner}){
  const [open,setOpen]=useState(false);
  const assignee=team.find(m=>m.id===task.assigneeId);
  const project=projects.find(p=>p.id===task.projectId);
  const over=isOverdue(task.dueDate,task.status);
  const done=task.checklist?.filter(i=>i.done).length||0;
  const total=task.checklist?.length||0;
  const canSee=isOwner||task.visibility==="public"||(currentMember&&task.assigneeId===currentMember.id);
  if(!canSee) return null;

  const markDone=()=>onUpdate({...task,status:"Needs Approval",completedAt:nowStr()});
  const approve=()=>onUpdate({...task,status:"Approved",approvedAt:nowStr()});
  const toggleStep=(id)=>onUpdate({...task,checklist:task.checklist.map(i=>i.id===id?{...i,done:!i.done}:i)});

  return <div className="hov fu" style={{background:T.card,border:`1px solid ${over?T.red+"66":T.border}`,borderRadius:12,padding:16,cursor:"pointer"}} onClick={()=>setOpen(!open)}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:8}}>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
          {task.visibility==="private"&&<span style={{fontSize:10,color:T.muted}}>🔒</span>}
          {over&&<span style={{fontSize:10,color:T.red,fontWeight:700}}>OVERDUE</span>}
          <span style={{fontSize:14,fontWeight:700,color:T.text,fontFamily:FF.head,lineHeight:1.3}}>{task.title}</span>
        </div>
        {project&&<div style={{fontSize:11,color:T.muted}}>📁 {project.name}</div>}
      </div>
      <div style={{display:"flex",gap:5,flexShrink:0}}>
        <Pill label={task.priority} color={PRIORITY_C[task.priority]}/>
        <Pill label={task.status} color={STATUS_C[task.status]}/>
      </div>
    </div>

    {/* Meta */}
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      {assignee&&<div style={{display:"flex",alignItems:"center",gap:5}}><Avatar name={assignee.name} size={20}/><span style={{fontSize:12,color:T.muted}}>{assignee.name}</span></div>}
      {task.dueDate&&<span style={{fontSize:12,color:over?T.red:T.muted}}>📅 {task.dueDate}</span>}
      {total>0&&<span style={{fontSize:12,color:done===total?T.green:T.muted}}>☑ {done}/{total}</span>}
    </div>

    {/* Expanded */}
    {open&&<div className="fi" onClick={e=>e.stopPropagation()} style={{marginTop:14,borderTop:`1px solid ${T.border}`,paddingTop:14}}>
      {task.description&&<p style={{fontSize:13,color:"#475569",lineHeight:1.6,marginBottom:12}}>{task.description}</p>}

      {total>0&&<div style={{marginBottom:14}}>
        <Bar v={done} max={total} color={T.green} h={4}/>
        <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
          {task.checklist.map(it=><div key={it.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,0.9)",borderRadius:6}}>
            <div onClick={()=>toggleStep(it.id)} style={{width:14,height:14,borderRadius:3,border:`2px solid ${it.done?T.green:T.border}`,background:it.done?T.green:"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>
              {it.done&&<span style={{color:"#000",fontSize:9,fontWeight:900}}>✓</span>}
            </div>
            <span style={{fontSize:12,color:it.done?T.muted:T.text,textDecoration:it.done?"line-through":"none"}}>{it.text}</span>
          </div>)}
        </div>
      </div>}

      {task.notes&&<p style={{fontSize:12,color:T.muted,fontStyle:"italic",borderLeft:`2px solid ${T.border}`,paddingLeft:10,marginBottom:12}}>{task.notes}</p>}

      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {!isOwner&&task.status==="In Progress"&&<Btn v="green" sm onClick={markDone}>✓ Mark Complete</Btn>}
        {isOwner&&task.status==="Needs Approval"&&<Btn v="green" sm onClick={approve}>✅ Approve</Btn>}
        {isOwner&&<><Btn v="blue" sm onClick={()=>onEdit(task)}>✏ Edit</Btn><Btn v="danger" sm onClick={()=>onDelete(task.id)}>🗑 Delete</Btn></>}
        {task.completedAt&&<span style={{fontSize:11,color:T.muted,marginLeft:"auto"}}>Completed: {task.completedAt}</span>}
        {task.approvedAt&&<span style={{fontSize:11,color:T.green,marginLeft:"auto"}}>✅ Approved: {task.approvedAt}</span>}
      </div>
    </div>}
  </div>;
}


function TasksPage({tasks,team,projects,currentMember,isOwner,onUpdate,onDelete,onAdd}){
  const [editTask,setEditTask]=useState(null);
  const [filter,setFilter]=useState("All");
  const [filterMember,setFilterMember]=useState("All");
  const [search,setSearch]=useState("");

  const visible=tasks.filter(t=>{
    if(!isOwner&&t.visibility==="private"&&t.assigneeId!==currentMember?.id) return false;
    if(filter!=="All"&&t.status!==filter) return false;
    if(filterMember!=="All"&&t.assigneeId!==filterMember) return false;
    if(search&&!t.title.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const overdueCnt=tasks.filter(t=>isOwner&&isOverdue(t.dueDate,t.status)).length;
  const pendingApproval=tasks.filter(t=>t.status==="Needs Approval").length;

  return <div style={{padding:"24px"}}>
    {/* Summary row */}
    {isOwner&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
      {[
        {l:"Total Tasks",v:tasks.length,c:T.text},
        {l:"In Progress",v:tasks.filter(t=>t.status==="In Progress").length,c:T.blue},
        {l:"Needs Approval",v:pendingApproval,c:T.amber,pulse:pendingApproval>0},
        {l:"Overdue",v:overdueCnt,c:T.red,pulse:overdueCnt>0},
        {l:"Completed",v:tasks.filter(t=>["Done","Approved"].includes(t.status)).length,c:T.green},
      ].map(s=><div key={s.l} className="fu" style={{background:T.card,border:`1px solid ${s.pulse?s.c+"55":T.border}`,borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
        <div style={{fontSize:10,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4,fontFamily:FF.head}}>{s.l}</div>
        <div style={{fontSize:22,fontWeight:800,color:s.c,fontFamily:FF.head,animation:s.pulse?"pulse 2s infinite":""}}>{s.v}</div>
      </div>)}
    </div>}

    {/* Filters */}
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search tasks…" className="inp"
        style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 12px",color:T.text,fontSize:13,fontFamily:FF.body,width:200}}/>
      {["All",...TASK_STATUSES].map(s=><button key={s} className="btn" onClick={()=>setFilter(s)} style={{
        padding:"6px 12px",borderRadius:7,fontSize:12,fontWeight:600,fontFamily:FF.head,cursor:"pointer",
        border:`1px solid ${filter===s?(STATUS_C[s]||T.gold):T.border}`,
        background:filter===s?(STATUS_C[s]||T.gold)+"22":"transparent",
        color:filter===s?(STATUS_C[s]||T.gold):T.muted}}>{s}</button>)}
      {isOwner&&<select value={filterMember} onChange={e=>setFilterMember(e.target.value)} className="inp"
        style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 12px",color:T.text,fontSize:13,fontFamily:FF.body}}>
        <option value="All">All Members</option>
        {team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
      </select>}
      <span style={{fontSize:12,color:T.faint,marginLeft:"auto"}}>{visible.length} tasks</span>
      {isOwner&&<Btn sm onClick={onAdd}>+ New Task</Btn>}
    </div>

    {visible.length===0?<div style={{textAlign:"center",padding:"48px 20px",color:T.muted}}>
      <div style={{fontSize:40,marginBottom:12}}>📋</div>
      <div style={{fontFamily:FF.head,fontSize:16}}>No tasks found</div>
    </div>:<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {visible.map((t,i)=><div key={t.id} style={{animationDelay:`${i*.03}s`}}>
        <TaskCard task={t} team={team} projects={projects} currentMember={currentMember} isOwner={isOwner}
          onUpdate={onUpdate} onDelete={onDelete} onEdit={setEditTask}/>
      </div>)}
    </div>}

    {editTask&&<TaskForm team={team} projects={projects} initial={editTask} onSave={t=>{onUpdate(t);setEditTask(null);}} onClose={()=>setEditTask(null)}/>}
  </div>;
}

function ProjectDetail({project,team,tasks,onClose,onUpdate,onDelete,categories}){
  const [tab,setTab]=useState("overview");
  const [edit,setEdit]=useState(false);
  const [ef,setEF]=useState({...project});
  const {received,expenses,profit,quoted,balance}=calcProject(project);
  const si=STAGES.indexOf(project.currentStage);
  const projTasks=tasks.filter(t=>t.projectId===project.id);
  const TABS=[
    {id:"overview",label:"Overview"},
    {id:"boq",label:"BOQ ("+(project.boq||[]).length+")"},
    {id:"payments",label:"Payments ("+(project.payments||[]).length+")"},
    {id:"expenses",label:"Expenses ("+(project.expenses||[]).length+")"},
    {id:"updates",label:"Updates ("+(project.updates||[]).length+")"},
    {id:"tasks",label:"Tasks ("+projTasks.length+")"},
    {id:"profit",label:"P&L"},
  ];
  const [payForm,setPayForm]=useState({label:"Advance",amount:"",date:today(),mode:"UPI",note:""});
  const [expForm,setExpForm]=useState({category:"Materials",description:"",amount:"",date:today(),vendor:"",paidBy:"Paid by Firm",billNo:""});
  const [updForm,setUpdForm]=useState({stage:project.currentStage,note:"",date:today()});
  const [boqForm,setBoqForm]=useState({stage:"Civil Work",description:"",unit:"sqft",qty:"",rate:""});
  const [editPayId,setEditPayId]=useState(null);
  const [editExpId,setEditExpId]=useState(null);
  const [editUpdId,setEditUpdId]=useState(null);
  const [editBoqId,setEditBoqId]=useState(null);
  const [editPayData,setEditPayData]=useState({});
  const [editExpData,setEditExpData]=useState({});
  const [editUpdData,setEditUpdData]=useState({});
  const [editBoqData,setEditBoqData]=useState({});
  const [confirmDel,setConfirmDel]=useState(null);

  const confirmDelete=(type,id,label)=>setConfirmDel({type,id,label});
  const doDelete=()=>{
    if(!confirmDel)return;
    const {type,id}=confirmDel;
    if(type==="payment")onUpdate({...project,payments:(project.payments||[]).filter(x=>x.id!==id)});
    if(type==="expense")onUpdate({...project,expenses:(project.expenses||[]).filter(x=>x.id!==id)});
    if(type==="update")onUpdate({...project,updates:(project.updates||[]).filter(x=>x.id!==id)});
    if(type==="boq")onUpdate({...project,boq:(project.boq||[]).filter(x=>x.id!==id)});
    setConfirmDel(null);
  };
  const addPayment=()=>{
    if(!payForm.amount)return;
    const newId=uid();
    const newPay=[...(project.payments||[]),{...payForm,id:newId,amount:Number(payForm.amount)}]
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    onUpdate({...project,payments:newPay});
    setPayForm(f=>({...f,amount:"",note:""}));
  };
  const saveEditPayment=()=>{const updated=(project.payments||[]).map(p=>p.id===editPayId?{...p,...editPayData,amount:Number(editPayData.amount)}:p).sort((a,b)=>(a.date||'').localeCompare(b.date||''));onUpdate({...project,payments:updated});setEditPayId(null);};
  const addExpense=()=>{
    if(!expForm.description||!expForm.amount)return;
    const newId=uid();
    const newExp=[...(project.expenses||[]),{...expForm,id:newId,amount:Number(expForm.amount)}]
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    onUpdate({...project,expenses:newExp});
    setExpForm(f=>({...f,description:"",amount:"",vendor:"",billNo:""}));
  };
  const saveEditExpense=()=>{const updated=(project.expenses||[]).map(e=>e.id===editExpId?{...e,...editExpData,amount:Number(editExpData.amount)}:e).sort((a,b)=>(a.date||'').localeCompare(b.date||''));onUpdate({...project,expenses:updated});setEditExpId(null);};
  const addUpdate=()=>{if(!updForm.note.trim())return;onUpdate({...project,updates:[{id:uid(),...updForm,time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})},...(project.updates||[])]});setUpdForm(f=>({...f,note:""}));};
  const saveEditUpdate=()=>{onUpdate({...project,updates:(project.updates||[]).map(u=>u.id===editUpdId?{...u,...editUpdData}:u)});setEditUpdId(null);};
  const addBoq=()=>{if(!boqForm.description||!boqForm.qty||!boqForm.rate)return;onUpdate({...project,boq:[...(project.boq||[]),{id:uid(),...boqForm,qty:Number(boqForm.qty),rate:Number(boqForm.rate)}]});setBoqForm(f=>({...f,description:"",qty:"",rate:""}));};
  const saveEditBoq=()=>{onUpdate({...project,boq:(project.boq||[]).map(b=>b.id===editBoqId?{...b,...editBoqData,qty:Number(editBoqData.qty),rate:Number(editBoqData.rate)}:b)});setEditBoqId(null);};

  const RowBtns=({onEdit,onDel})=>(
    <div style={{display:"flex",gap:4,flexShrink:0}}>
      <button onClick={onEdit} className="btn" style={{background:T.faint,border:"1px solid #1D4ED844",borderRadius:6,padding:"3px 9px",color:T.blue,fontSize:11,fontWeight:700,fontFamily:FF.head,cursor:"pointer"}}>✏ Edit</button>
      <button onClick={onDel} className="btn" style={{background:"#1A0404",border:"1px solid #7F1D1D55",borderRadius:6,padding:"3px 9px",color:T.red,fontSize:11,fontWeight:700,fontFamily:FF.head,cursor:"pointer"}}>🗑</button>
    </div>
  );

  return <><Modal title="" onClose={onClose} wide>
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
        <div>
          {edit?<Inp value={ef.name} onChange={e=>setEF(f=>({...f,name:e.target.value}))} style={{fontSize:20,fontFamily:FF.head,fontWeight:800}}/>
            :<h2 style={{margin:0,fontSize:22,fontFamily:FF.head,fontWeight:800,color:T.text}}>{project.name}</h2>}
          <div style={{fontSize:13,color:T.muted,marginTop:3}}>{project.clientName}{project.clientPhone?" · "+project.clientPhone:""}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {edit?<><Btn v="ghost" sm onClick={()=>setEdit(false)}>Cancel</Btn><Btn sm onClick={()=>{onUpdate(ef);setEdit(false);}}>Save</Btn></>:<Btn v="subtle" sm onClick={()=>setEdit(true)}>✏ Edit</Btn>}

            </div>

          <span style={{fontSize:13,color:T.muted}}>Total: <span style={{color:T.red,fontWeight:700,fontSize:16}}>{fmt(expenses)}</span></span>

                </div>

                  <Pill label={u.stage} color={STAGE_C[u.stage]||T.gold}/>

            <div style={{fontSize:30,fontWeight:800,fontFamily:FF.head,color:profit>=0?T.green:T.red}}>{fmt(Math.abs(profit))}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:T.muted,marginBottom:4}}>Margin</div>
            <div style={{fontSize:26,fontWeight:800,fontFamily:FF.head,color:received?pct(profit,received)>=20?T.green:pct(profit,received)>=10?T.amber:T.red:T.muted}}>{received?pct(profit,received):0}%</div>
          </div>
        </div>
      </div>}
    </div>
  </Modal>
  {confirmDel&&<ConfirmDialog item={confirmDel}
    onConfirm={()=>{if(confirmDel.type==="project"){onDelete(project.id);onClose();}else doDelete();}}
    onCancel={()=>setConfirmDel(null)}/>}
  </>;
}

function CategoriesModal({categories,onSave,onClose}){
  const [cats,setCats]=useState([...categories]);
  const [newCat,setNewCat]=useState('');
  const add=()=>{
    if(!newCat.trim()||cats.includes(newCat.trim())) return;
    setCats(c=>[...c,newCat.trim()]);
    setNewCat('');
  };
  const remove=(cat)=>setCats(c=>c.filter(x=>x!==cat));
  const moveUp=(i)=>{if(i===0)return;const a=[...cats];[a[i-1],a[i]]=[a[i],a[i-1]];setCats(a);};
  const moveDown=(i)=>{if(i===cats.length-1)return;const a=[...cats];[a[i],a[i+1]]=[a[i+1],a[i]];setCats(a);};

  return <Modal title="⚙ Manage Expense Categories" onClose={onClose}>
    <div style={{marginBottom:16}}>
      <div style={{fontSize:12,color:T.muted,marginBottom:10}}>Add, remove or reorder your expense categories. Changes apply to all projects.</div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}
          placeholder="New category name…" className="inp"
          style={{flex:1,background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:14}}/>
        <Btn sm onClick={add}>+ Add</Btn>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:320,overflowY:"auto"}}>
        {cats.map((cat,i)=>(
          <div key={cat} className="sr" style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"rgba(255,255,255,0.8)",border:"1px solid "+T.border,borderRadius:8}}>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <button onClick={()=>moveUp(i)} className="btn" style={{background:"none",border:"none",color:T.muted,fontSize:10,padding:"0 2px",lineHeight:1}}>▲</button>
              <button onClick={()=>moveDown(i)} className="btn" style={{background:"none",border:"none",color:T.muted,fontSize:10,padding:"0 2px",lineHeight:1}}>▼</button>
            </div>
            <span style={{flex:1,fontSize:14,fontWeight:600,color:T.text}}>{cat}</span>
            <span style={{fontSize:11,color:T.muted,background:"rgba(184,134,11,0.1)",padding:"2px 8px",borderRadius:20,border:"1px solid rgba(184,134,11,0.2)"}}>Category {i+1}</span>
            <button onClick={()=>remove(cat)} className="btn" style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,padding:"4px 8px",color:T.red,fontSize:12,fontWeight:700}}>✕ Remove</button>
          </div>
        ))}
        {cats.length===0&&<div style={{textAlign:"center",padding:"24px",color:T.muted,fontSize:13}}>No categories. Add one above.</div>}
      </div>
    </div>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",borderTop:"1px solid "+T.border,paddingTop:14}}>
      <Btn v="subtle" onClick={onClose}>Cancel</Btn>
      <Btn onClick={()=>onSave(cats)}>Save Categories</Btn>
    </div>
  </Modal>;
}



function ExpensesPage({projects,categories}){
  const [filterCat,setFilterCat]=useState('All');
  const [filterProject,setFilterProject]=useState('All');
  const [filterPaidBy,setFilterPaidBy]=useState('All');
  const [fromDate,setFromDate]=useState('');
  const [toDate,setToDate]=useState('');
  const [search,setSearch]=useState('');
  const [sortBy,setSortBy]=useState('date-desc');

  // Flatten all expenses from all projects
  const allExpenses = (projects||[]).flatMap(p=>
    (p.expenses||[]).map(e=>({...e, projectName:p.name, projectId:p.id}))
  );

  // Apply filters
  const filtered = allExpenses.filter(e=>{
    if(filterCat!=='All' && e.category!==filterCat) return false;
    if(filterProject!=='All' && e.projectId!==filterProject) return false;
    if(filterPaidBy!=='All' && e.paidBy!==filterPaidBy) return false;
    if(fromDate && e.date && e.date < fromDate) return false;
    if(toDate && e.date && e.date > toDate) return false;
    if(search && !e.description?.toLowerCase().includes(search.toLowerCase()) &&
       !e.vendor?.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==='date-desc') return (b.date||'').localeCompare(a.date||'');
    if(sortBy==='date-asc') return (a.date||'').localeCompare(b.date||'');
    if(sortBy==='amount-desc') return Number(b.amount||0)-Number(a.amount||0);
    if(sortBy==='amount-asc') return Number(a.amount||0)-Number(b.amount||0);
    return 0;
  });

  const total = filtered.reduce((a,e)=>a+Number(e.amount||0),0);
  const firmTotal = filtered.filter(e=>e.paidBy!=='Paid by Client').reduce((a,e)=>a+Number(e.amount||0),0);
  const clientTotal = filtered.filter(e=>e.paidBy==='Paid by Client').reduce((a,e)=>a+Number(e.amount||0),0);

  // Category summary
  const catSummary = (categories||DEFAULT_EXPENSE_CATS).map(cat=>({
    cat, total: filtered.filter(e=>e.category===cat).reduce((a,e)=>a+Number(e.amount||0),0),
    count: filtered.filter(e=>e.category===cat).length
  })).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

  // Export to CSV (opens as Excel)
  const exportCSV=()=>{
    const headers=['Date','Project','Category','Description','Vendor','Bill No','Amount','Paid By'];
    const rows=filtered.map(e=>[e.date||'',e.projectName||'',e.category||'',e.description||'',e.vendor||'',e.billNo||'',e.amount||0,e.paidBy||'']);
        const NL=String.fromCharCode(10);const esc=v=>{const s=String(v);return s.indexOf(',')>=0?'"'+s.split('"').join('""')+'"':s;};const csv=[headers,...rows].map(r=>r.map(esc).join(',')).join(NL);
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='AMARAN-EXPENSES-'+new Date().toISOString().split('T')[0]+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  const clearFilters=()=>{setFilterCat('All');setFilterProject('All');setFilterPaidBy('All');setFromDate('');setToDate('');setSearch('');};
  const hasFilters=filterCat!=='All'||filterProject!=='All'||filterPaidBy!=='All'||fromDate||toDate||search;

  return <div style={{padding:"20px 24px 40px"}}>
    {/* Summary cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:20}}>
      {[
        {l:"Total Expenses",v:fmt(total),c:T.red,icon:"🧾"},
        {l:"Paid by Firm",v:fmt(firmTotal),c:T.purple,icon:"🏢"},
        {l:"Paid by Client",v:fmt(clientTotal),c:T.blue,icon:"👤"},
        {l:"Transactions",v:filtered.length,c:T.text,icon:"📋"},
      ].map(s=><div key={s.l} className="fu" style={{background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:12,padding:"14px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
          <span>{s.icon}</span>
          <span style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",fontFamily:FF.head}}>{s.l}</span>
        </div>
        <div style={{fontSize:20,fontWeight:800,color:s.c,fontFamily:FF.head}}>{s.v}</div>
      </div>)}
    </div>

    {/* Category summary bar */}
    {catSummary.length>0&&<div style={{background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:12,padding:"16px 18px",marginBottom:20}}>
      <div style={{fontSize:13,fontWeight:700,color:T.text,fontFamily:FF.head,marginBottom:12}}>Category Breakdown</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {catSummary.map(s=>(
          <div key={s.cat} style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:13,color:T.text,minWidth:140,fontWeight:600}}>{s.cat}</span>
            <div style={{flex:1,background:T.faint,borderRadius:99,height:8,overflow:"hidden"}}>
              <div style={{width:pct(s.total,total)+'%',height:"100%",background:T.gold,borderRadius:99,transition:"width .5s"}}/>
            </div>
            <span style={{fontSize:12,color:T.muted,minWidth:50,textAlign:"right"}}>{s.count} items</span>
            <span style={{fontSize:13,fontWeight:700,color:T.red,minWidth:90,textAlign:"right"}}>{fmt(s.total)}</span>
            <span style={{fontSize:11,color:T.muted,minWidth:35,textAlign:"right"}}>{pct(s.total,total)}%</span>
          </div>
        ))}
      </div>
    </div>}

    {/* Filters */}
    <div style={{background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:12,padding:"16px 18px",marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:T.text,fontFamily:FF.head}}>Filters</div>
        <div style={{display:"flex",gap:8}}>
          {hasFilters&&<Btn v="subtle" sm onClick={clearFilters}>✕ Clear</Btn>}
          <Btn sm onClick={exportCSV}>📥 Export Excel</Btn>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search description / vendor…" className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}/>
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}>
          <option value="All">All Categories</option>
          {(categories||DEFAULT_EXPENSE_CATS).map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={filterProject} onChange={e=>setFilterProject(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}>
          <option value="All">All Projects</option>
          {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <select value={filterPaidBy} onChange={e=>setFilterPaidBy(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}>
          <option value="All">All — Paid By</option>
          <option>Paid by Firm</option>
          <option>Paid by Client</option>
        </select>
        <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}
          placeholder="From date"/>
        <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}
          placeholder="To date"/>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="inp"
          style={{background:"white",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:13}}>
          <option value="date-desc">Date — Newest First</option>
          <option value="date-asc">Date — Oldest First</option>
          <option value="amount-desc">Amount — High to Low</option>
          <option value="amount-asc">Amount — Low to High</option>
        </select>
      </div>
    </div>

    {/* Expenses list */}
    <div style={{background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:12,overflow:"hidden"}}>
      {/* Table header */}
      <div style={{display:"grid",gridTemplateColumns:"90px 1fr 120px 120px 100px 90px 100px",gap:0,padding:"10px 16px",background:"rgba(184,134,11,0.08)",borderBottom:"1px solid "+T.border}}>
        {['Date','Description','Project','Category','Vendor','Paid By','Amount'].map(h=>(
          <div key={h} style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",fontFamily:FF.head}}>{h}</div>
        ))}
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",padding:"40px",color:T.muted}}>
        <div style={{fontSize:32,marginBottom:8}}>🧾</div>
        <div style={{fontFamily:FF.head}}>No expenses match your filters</div>
      </div>}
      {filtered.map((e,i)=>(
        <div key={e.id} className="row-hover" style={{display:"grid",gridTemplateColumns:"90px 1fr 120px 120px 100px 90px 100px",gap:0,padding:"11px 16px",borderBottom:i<filtered.length-1?"1px solid "+T.faint:"none",alignItems:"center"}}>
          <span style={{fontSize:12,color:T.muted}}>{e.date||'—'}</span>
          <div>

        <span style={{fontSize:14,fontWeight:700,color:T.red,fontFamily:FF.head}}>Total: {fmt(total)}</span>
      </div>}

  </div>;
}

function LoginPage({team,onLogin}){
  const [mode,setMode]=useState(null);
  const [pin,setPin]=useState('');
  const [error,setError]=useState('');
  const OWNER_PIN='2026';

  const handleDigit=(k)=>{
    if(k==='back'){setPin(p=>p.slice(0,-1));setError('');return;}
    if(pin.length>=4) return;
    const newPin=pin+k;
    setPin(newPin);
    if(newPin.length===4){
      setTimeout(()=>{
        if(mode==='owner'){
          if(newPin===OWNER_PIN){setPin('');setError('');onLogin('owner');}
          else{setError('Wrong PIN. Try again.');setPin('');}
        } else {
          const matched=team.find(m=>m.pin===newPin);
          if(matched){setPin('');setError('');onLogin(matched.id);}
          else{setError('Wrong PIN. Try again.');setPin('');}
        }
      },300);
    }
  };

  const KEYS=[['1','2','3'],['4','5','6'],['7','8','9'],['','0','back']];

  const PinScreen=({title,icon})=>(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f0fe 0%,#f3e8ff 35%,#fff7ed 65%,#e0f2fe 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:FF.body}}>
      <div style={{background:"rgba(255,255,255,0.96)",borderRadius:24,padding:"36px 28px",width:"100%",maxWidth:340,boxShadow:"0 20px 60px rgba(0,0,0,0.1)",textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:10}}>{icon}</div>
        <div style={{fontSize:18,fontWeight:800,color:T.text,fontFamily:FF.head,marginBottom:4}}>{title}</div>
        <div style={{fontSize:13,color:T.muted,marginBottom:24}}>Enter your 4-digit PIN</div>
        <div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:28}}>
          {[0,1,2,3].map(i=>(
            <div key={i} style={{width:14,height:14,borderRadius:"50%",background:pin.length>i?"#B8860B":"#E2E8F0",transition:"all 0.15s"}}/>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
          {KEYS.flat().map((k,i)=>(
            <button key={i} onClick={()=>{if(k!=='')handleDigit(k==='back'?'back':k);}}
              style={{padding:"16px 0",borderRadius:12,border:k===''?"none":"1px solid #E2E8F0",
                background:k===''?"transparent":k==='back'?"#FEF2F2":"white",
                fontSize:k==='back'?16:20,fontWeight:600,color:k==='back'?"#DC2626":T.text,
                cursor:k===''?"default":"pointer",fontFamily:FF.head}}>

      <div style={{width:"100%",maxWidth:400}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{fontSize:52,marginBottom:14}}>🏛</div>
          <div style={{fontSize:26,fontWeight:800,fontFamily:FF.head,color:T.text}}>AMARAN INTERIORS</div>

        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <button onClick={()=>{setMode('owner');setPin('');setError('');}}
            style={{background:"linear-gradient(135deg,#B8860B,#8A6A1A)",border:"none",borderRadius:16,padding:"20px 24px",
              display:"flex",alignItems:"center",gap:16,width:"100%",cursor:"pointer",
              boxShadow:"0 4px 20px rgba(184,134,11,0.3)"}}>
            <div style={{width:44,height:44,background:"rgba(255,255,255,0.2)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>👑</div>

              <div style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:FF.head}}>Owner / Admin</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginTop:2}}></div>
            </div>
            <div style={{color:"rgba(255,255,255,0.7)",fontSize:20}}>→</div>
          </button>
          <button onClick={()=>{setMode('member');setPin('');setError('');}}
            style={{background:"rgba(255,255,255,0.92)",border:"1px solid #E2E8F0",borderRadius:16,padding:"20px 24px",
              display:"flex",alignItems:"center",gap:16,width:"100%",cursor:"pointer",
              boxShadow:"0 4px 16px rgba(0,0,0,0.06)"}}>
            <div style={{width:44,height:44,background:"#EFF6FF",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>👤</div>
            <div style={{textAlign:"left",flex:1}}>
              <div style={{fontSize:16,fontWeight:700,color:T.text,fontFamily:FF.head}}>Team Member</div>
              <div style={{fontSize:12,color:T.muted,marginTop:2}}>Enter your PIN to login</div>
            </div>
            <div style={{color:T.muted,fontSize:20}}>→</div>
          </button>
        </div>
        <div style={{textAlign:"center",marginTop:28,fontSize:11,color:T.muted}}>AMARAN INTERIORS © {new Date().getFullYear()}</div>

}



export default function App(){
  const [data,setData]=useState({projects:[],team:[],tasks:[],expenseCats:[...DEFAULT_EXPENSE_CATS],stockItems:[],stockMoves:[],stockCats:DEFAULT_STOCK_CATS});
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [driveErr,setDriveErr]=useState(false);
  const [loggedIn,setLoggedIn]=useState(null);
  const [page,setPage]=useState("projects");
  const [showNewProject,setShowNewProject]=useState(false);
  const [showNewTask,setShowNewTask]=useState(false);
  const [showCategories,setShowCategories]=useState(false);
  const [detailProject,setDetailProject]=useState(null);
  const [filterStatus,setFilterStatus]=useState("All");
  const [search,setSearch]=useState("");
  const saveRef=useRef(null);
  const isSavingRef=useRef(false);
  const pendingDataRef=useRef(null);

  useEffect(()=>{
    loadData()
      .then(d=>{
        setData({projects:d.projects||[],team:d.team||[],tasks:d.tasks||[],expenseCats:d.expenseCats||[...DEFAULT_EXPENSE_CATS],stockItems:d.stockItems||[],stockMoves:d.stockMoves||[],stockCats:d.stockCats||DEFAULT_STOCK_CATS});
        setLoading(false);
      })
      .catch(e=>{
        console.error('Load failed:',e);
        setDriveErr(true);
        setLoading(false);
      });
  },[]);

  const persist=useCallback((d)=>{
    // Always store latest data
    pendingDataRef.current = d;
    if(saveRef.current) clearTimeout(saveRef.current);
    saveRef.current=setTimeout(async()=>{
      if(isSavingRef.current) {
        // Reschedule so pending data is not lost
        persist(pendingDataRef.current);
        return;
      }
      isSavingRef.current = true;
      setSaving(true);
      const toSave = pendingDataRef.current;
      try{
        await saveData(toSave);
      }catch(e){console.error('Save failed:',e);}
      isSavingRef.current = false;
      setSaving(false);
    },2000);
  },[]);

  const update=useCallback((key,val)=>{
    setData(prev=>{
      const nd={...prev,[key]:val};
      persist(nd);
      return nd;
    });
  },[persist]);
  const updateProject=useCallback((p)=>{
    setData(prev=>{
      const ps=dedup(prev.projects.find(x=>x.id===p.id)?prev.projects.map(x=>x.id===p.id?p:x):[...prev.projects,p]);
      const nd={...prev,projects:ps};
      persist(nd);
      return nd;
    });
    setShowNewProject(false);
    setDetailProject(dp=>dp?.id===p.id?p:dp);
  },[persist]);
  const deleteProject=useCallback((id)=>{
    setData(prev=>{const nd={...prev,projects:prev.projects.filter(p=>p.id!==id)};persist(nd);return nd;});
  },[persist]);
  const updateTask=useCallback((t)=>{
    setData(prev=>{
      const ts=dedup(prev.tasks.find(x=>x.id===t.id)?prev.tasks.map(x=>x.id===t.id?t:x):[...prev.tasks,t]);
      const nd={...prev,tasks:ts};persist(nd);return nd;
    });
    setShowNewTask(false);
  },[persist]);
  const deleteTask=useCallback((id)=>{setData(prev=>{const nd={...prev,tasks:prev.tasks.filter(t=>t.id!==id)};persist(nd);return nd;});},[persist]);
  const updateTeam=useCallback((fn)=>{setData(prev=>{const nd={...prev,team:dedup(fn(prev.team))};persist(nd);return nd;});},[persist]);

  const isOwner=loggedIn==="owner";
  const currentMember=!isOwner?data.team.find(m=>m.id===loggedIn):null;

  const dash={
    active:data.projects.filter(p=>p.status==="Active").length,
    totalQuoted:data.projects.reduce((a,p)=>a+Number(p.quotedAmount||0),0),
    totalReceived:data.projects.reduce((a,p)=>a+(p.payments||[]).reduce((s,x)=>s+x.amount,0),0),
    totalExpenses:data.projects.reduce((a,p)=>a+(p.expenses||[]).reduce((s,e)=>s+e.amount,0),0),
    pendingApproval:data.tasks.filter(t=>t.status==="Needs Approval").length,
    overdueTasks:data.tasks.filter(t=>isOverdue(t.dueDate,t.status)).length,
  };

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"sans-serif",background:"linear-gradient(135deg,#e8f0fe 0%,#f3e8ff 35%,#fff7ed 65%,#e0f2fe 100%)"}}>
    <div style={{textAlign:"center",background:"rgba(255,255,255,0.95)",padding:"40px",borderRadius:"16px",boxShadow:"0 8px 32px rgba(0,0,0,0.1)"}}>
      <div style={{fontSize:48,marginBottom:16}}>🏛</div>
      <div style={{color:"#B8860B",fontSize:18,fontWeight:700,marginBottom:8}}>AMARAN INTERIORS</div>
      <div style={{color:"#64748B",fontSize:14,marginBottom:16}}>Connecting to Firebase...</div>
      <div style={{width:200,height:4,background:"#E2E8F0",borderRadius:99,overflow:"hidden",margin:"0 auto"}}>
        <div style={{width:"60%",height:"100%",background:"#B8860B",borderRadius:99,animation:"pulse 1s infinite"}}/>
      </div>
      {driveErr&&<div style={{marginTop:16,color:"#DC2626",fontSize:13,background:"#FEF2F2",padding:"8px 16px",borderRadius:8}}>
        ⚠ Connection failed. Check internet connection and try refreshing.
      </div>}
    </div>
  </div>;

  if(!loggedIn) return <LoginPage team={data.team} onLogin={setLoggedIn}/>;

  if(!isOwner&&currentMember) return <MemberView member={currentMember} tasks={data.tasks} projects={data.projects} team={data.team} onUpdate={updateTask} onLogout={()=>setLoggedIn(null)}/>;

  const filteredProjects=data.projects.filter(p=>{
    if(filterStatus!=="All"&&p.status!==filterStatus) return false;
    if(search&&!p.name.toLowerCase().includes(search.toLowerCase())&&!p.clientName.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const NAV=[{id:"projects",label:"🏗 Projects"},{id:"expenses",label:"🧾 Expenses"},{id:"stock",label:"📦 Stock"},{id:"tasks",label:"✅ Tasks"},{id:"team",label:"👥 Team"}];

  return <div style={{minHeight:"100vh",fontFamily:FF.body,color:T.text}}>
    
    <div style={{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",borderBottom:"1px solid "+T.border,padding:"0 24px",height:62,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:38,height:38,background:"linear-gradient(135deg,"+T.gold+","+T.goldD+")",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🏛</div>
        <div>
          <div style={{fontSize:18,fontWeight:800,fontFamily:FF.head,color:T.text,lineHeight:1}}>AMARAN INTERIORS</div>
          <div style={{fontSize:10,color:T.muted}}>Management Portal · Owner View</div>
        </div>
        <div style={{display:"flex",gap:2,marginLeft:16}}>
          {NAV.map(n=><button key={n.id} onClick={()=>setPage(n.id)} className="btn tab"
            style={{padding:"7px 14px",background:page===n.id?"rgba(184,134,11,0.1)":"transparent",
              border:"1px solid "+(page===n.id?T.gold:"transparent"),
              borderRadius:8,color:page===n.id?T.gold:T.muted,fontSize:13,fontWeight:700,fontFamily:FF.head}}>
            {n.label}
            {n.id==="tasks"&&dash.pendingApproval>0&&<span style={{marginLeft:5,background:T.amber,color:"#fff",borderRadius:99,padding:"1px 6px",fontSize:10,fontWeight:800}}>{dash.pendingApproval}</span>}
          </button>)}
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {saving&&<span style={{fontSize:11,color:T.muted}}>Saving…</span>}
        {!saving&&data.projects.length>0&&<span style={{fontSize:11,color:T.green}}>✓ Saved</span>}
        {driveErr&&<span style={{fontSize:11,color:T.red}}>⚠ Connection error</span>}
        <Btn v="subtle" sm onClick={()=>setShowCategories(true)}>⚙ Categories</Btn>
        <Btn v="subtle" sm onClick={()=>setLoggedIn(null)}>← Logout</Btn>
        {page==="projects"&&<Btn sm onClick={()=>setShowNewProject(true)}>+ New Project</Btn>}
        {page==="tasks"&&<Btn sm onClick={()=>setShowNewTask(true)}>+ New Task</Btn>}
      </div>
    </div>

    {page==="projects"&&<div style={{background:"rgba(255,255,255,0.6)",backdropFilter:"blur(8px)",borderBottom:"1px solid "+T.border,padding:"12px 24px",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10}}>
      {[
        {l:"Active Projects",v:dash.active,c:T.green,icon:"🏗"},
        {l:"Total Quoted",v:fmt(dash.totalQuoted),c:T.gold,icon:"📋"},
        {l:"Total Received",v:fmt(dash.totalReceived),c:T.green,icon:"💰"},
        {l:"Total Expenses",v:fmt(dash.totalExpenses),c:T.red,icon:"🧾"},
        {l:"Net Profit",v:fmt(dash.totalReceived-dash.totalExpenses),c:(dash.totalReceived-dash.totalExpenses)>=0?T.green:T.red,icon:"📊"},
        {l:"Overdue Tasks",v:dash.overdueTasks,c:dash.overdueTasks>0?T.red:T.muted,icon:"⚠️"},
      ].map(s=><div key={s.l} className="fu" style={{background:"rgba(255,255,255,0.8)",border:"1px solid "+T.border,borderRadius:10,padding:"10px 12px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
          <span style={{fontSize:14}}>{s.icon}</span>
          <span style={{fontSize:10,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",fontFamily:FF.head}}>{s.l}</span>
        </div>
        <div style={{fontSize:17,fontWeight:800,color:s.c,fontFamily:FF.head}}>{s.v}</div>
      </div>)}
    </div>}

    {page==="projects"&&<div style={{padding:"20px 24px 40px"}}>
      <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search projects or clients…" className="inp"
          style={{background:"rgba(255,255,255,0.9)",border:"1px solid "+T.border,borderRadius:8,padding:"8px 14px",color:T.text,fontSize:13,width:230}}/>
        {["All","Active","On Hold","Completed","Cancelled"].map(s=><button key={s} className="btn" onClick={()=>setFilterStatus(s)} style={{
          padding:"7px 13px",borderRadius:8,fontSize:12,fontWeight:600,fontFamily:FF.head,cursor:"pointer",
          border:"1px solid "+(filterStatus===s?T.gold:T.border),
          background:filterStatus===s?"rgba(184,134,11,0.1)":"rgba(255,255,255,0.7)",
          color:filterStatus===s?T.gold:T.muted}}>{s}</button>)}
        <span style={{fontSize:12,color:T.muted,marginLeft:"auto"}}>{filteredProjects.length} projects</span>
      </div>
      {filteredProjects.length===0?<div style={{textAlign:"center",padding:"60px 20px"}}>
        <div style={{fontSize:52,marginBottom:16}}>🏗</div>
        <div style={{fontSize:20,fontFamily:FF.head,color:T.muted,marginBottom:20}}>No projects yet</div>
        <Btn onClick={()=>setShowNewProject(true)}>+ Create First Project</Btn>
      </div>:<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
        {filteredProjects.map((p,i)=><div key={p.id} style={{animationDelay:i*.04+"s"}}>
          <ProjectCard p={p} team={data.team} tasks={data.tasks} onClick={()=>setDetailProject(p)}/>
        </div>)}
      </div>}
    </div>}

    {page==="expenses"&&<ExpensesPage projects={data.projects} categories={data.expenseCats||DEFAULT_EXPENSE_CATS}/>}
    {page==="stock"&&<StockPage
      stockItems={data.stockItems||[]}
      stockMovements={data.stockMoves||[]}
      stockCategories={data.stockCats||DEFAULT_STOCK_CATS}
      projects={data.projects}
      team={data.team}
      currentUser={loggedIn}
      onUpdateItems={items=>update("stockItems",items)}
      onUpdateMovements={moves=>update("stockMoves",moves)}
      onUpdateCategories={cats=>update("stockCats",cats)}
    />}
    {page==="tasks"&&<TasksPage tasks={data.tasks} team={data.team} projects={data.projects}
      currentMember={null} isOwner={true} onUpdate={updateTask} onDelete={deleteTask}
      onAdd={()=>setShowNewTask(true)}/>}

    {page==="team"&&<TeamPage team={data.team} setTeam={updateTeam} tasks={data.tasks} projects={data.projects}/>}

    {showCategories&&<CategoriesModal categories={data.expenseCats||DEFAULT_EXPENSE_CATS} onSave={(cats)=>{update("expenseCats",cats);setShowCategories(false);}} onClose={()=>setShowCategories(false)}/>}
    {showNewProject&&<NewProjectForm onSave={updateProject} onClose={()=>setShowNewProject(false)}/>}
    {showNewTask&&<TaskForm team={data.team} projects={data.projects} onSave={updateTask} onClose={()=>setShowNewTask(false)}/>}
    {detailProject&&<ProjectDetail project={detailProject} team={data.team} tasks={data.tasks} categories={data.expenseCats||DEFAULT_EXPENSE_CATS}
      onClose={()=>setDetailProject(null)} onUpdate={updateProject} onDelete={deleteProject}/>}
  </div>;
}

const STOCK_UNITS = ["nos","box","litre","kg","metre","sqft","bag","roll","sheet","pair","set"];
const MOVE_TYPES = {
  purchase:{label:"Purchase / Inward",icon:"📥",color:"#16A34A",sign:1},
  issue:{label:"Issue to Site",icon:"📤",color:"#DC2626",sign:-1},
  return:{label:"Return from Site",icon:"🔄",color:"#2563EB",sign:1},
  direct:{label:"Direct to Site",icon:"🚚",color:"#D97706",sign:0},
};

// ── Stock Category Manager ─────────────────────────────────────────────────────
function StockCatManager({cats,onSave,onClose}){
  const [data,setData]=useState(JSON.parse(JSON.stringify(cats)));
  const [selCat,setSelCat]=useState(null);
  const [selSub,setSelSub]=useState(null);
  const [newCat,setNewCat]=useState('');
  const [newSub,setNewSub]=useState('');
  const [newBrand,setNewBrand]=useState('');

  const addCat=()=>{if(!newCat.trim())return;setData(d=>[...d,{id:uid(),name:newCat.trim(),subs:[]}]);setNewCat('');};
  const delCat=(id)=>setData(d=>d.filter(c=>c.id!==id));
  const addSub=()=>{if(!selCat||!newSub.trim())return;setData(d=>d.map(c=>c.id===selCat?{...c,subs:[...c.subs,{id:uid(),name:newSub.trim(),brands:[]}]}:c));setNewSub('');};
  const delSub=(cid,sid)=>setData(d=>d.map(c=>c.id===cid?{...c,subs:c.subs.filter(s=>s.id!==sid)}:c));
  const addBrand=()=>{if(!selCat||!selSub||!newBrand.trim())return;setData(d=>d.map(c=>c.id===selCat?{...c,subs:c.subs.map(s=>s.id===selSub?{...s,brands:[...s.brands,newBrand.trim()]}:s)}:c));setNewBrand('');};
  const delBrand=(cid,sid,b)=>setData(d=>d.map(c=>c.id===cid?{...c,subs:c.subs.map(s=>s.id===sid?{...s,brands:s.brands.filter(x=>x!==b)}:s)}:c));

  const cat=data.find(c=>c.id===selCat);
  const sub=cat?.subs.find(s=>s.id===selSub);

  return <Modal title="📂 Manage Stock Categories" onClose={onClose} wide>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
      {/* Categories */}
      <div>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",marginBottom:8,fontFamily:FF.head}}>Categories</div>
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCat()} placeholder="New category…" className="inp"
            style={{flex:1,background:"white",border:`1px solid ${T.border}`,borderRadius:7,padding:"7px 10px",fontSize:13,color:T.text}}/>
          <Btn sm onClick={addCat}>+</Btn>
        </div>
        <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
          {data.map(c=><div key={c.id} onClick={()=>{setSelCat(c.id);setSelSub(null);}} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selCat===c.id?T.gold+"22":"rgba(255,255,255,0.8)",border:`1px solid ${selCat===c.id?T.gold:T.border}`}}>
            <span style={{flex:1,fontSize:13,fontWeight:600,color:T.text}}>{c.name}</span>
            <span style={{fontSize:11,color:T.muted}}>{c.subs.length} subs</span>
            <button onClick={e=>{e.stopPropagation();delCat(c.id);}} className="btn" style={{background:"none",border:"none",color:T.red,fontSize:13}}>✕</button>
          </div>)}
        </div>
      </div>

      {/* Subcategories */}
      <div>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",marginBottom:8,fontFamily:FF.head}}>Subcategories {cat?`— ${cat.name}`:""}</div>
        {selCat?<>
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            <input value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSub()} placeholder="New subcategory…" className="inp"
              style={{flex:1,background:"white",border:`1px solid ${T.border}`,borderRadius:7,padding:"7px 10px",fontSize:13,color:T.text}}/>
            <Btn sm onClick={addSub}>+</Btn>
          </div>
          <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
            {cat?.subs.map(s=><div key={s.id} onClick={()=>setSelSub(s.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selSub===s.id?T.blue+"22":"rgba(255,255,255,0.8)",border:`1px solid ${selSub===s.id?T.blue:T.border}`}}>
              <span style={{flex:1,fontSize:13,fontWeight:600,color:T.text}}>{s.name}</span>
              <span style={{fontSize:11,color:T.muted}}>{s.brands.length} brands</span>
              <button onClick={e=>{e.stopPropagation();delSub(selCat,s.id);}} className="btn" style={{background:"none",border:"none",color:T.red,fontSize:13}}>✕</button>
            </div>)}
          </div>
        </>:<p style={{fontSize:13,color:T.muted,textAlign:"center",paddingTop:20}}>Select a category first</p>}
      </div>

      {/* Brands */}
      <div>
        <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",marginBottom:8,fontFamily:FF.head}}>Brands {sub?`— ${sub.name}`:""}</div>
        {selSub?<>
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            <input value={newBrand} onChange={e=>setNewBrand(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBrand()} placeholder="New brand…" className="inp"
              style={{flex:1,background:"white",border:`1px solid ${T.border}`,borderRadius:7,padding:"7px 10px",fontSize:13,color:T.text}}/>
            <Btn sm onClick={addBrand}>+</Btn>
          </div>
          <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
            {sub?.brands.map(b=><div key={b} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.8)",border:`1px solid ${T.border}`}}>
              <span style={{flex:1,fontSize:13,color:T.text}}>{b}</span>
              <button onClick={()=>delBrand(selCat,selSub,b)} className="btn" style={{background:"none",border:"none",color:T.red,fontSize:13}}>✕</button>
            </div>)}
          </div>
        </>:<p style={{fontSize:13,color:T.muted,textAlign:"center",paddingTop:20}}>Select a subcategory first</p>}
      </div>
    </div>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:18,borderTop:`1px solid ${T.border}`,paddingTop:14}}>
      <Btn v="subtle" onClick={onClose}>Cancel</Btn>
      <Btn onClick={()=>onSave(data)}>Save Categories</Btn>
    </div>
  </Modal>;
}

// ── Add Stock Item ─────────────────────────────────────────────────────────────
function AddStockItemForm({stockCategories,onSave,onClose,initial}){
  const [f,setF]=useState(initial||{name:"",category:"",subcategory:"",brand:"",unit:"nos",minStock:"",notes:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const cat=stockCategories.find(c=>c.name===f.category);
  const sub=cat?.subs.find(s=>s.name===f.subcategory);
  return <Modal title={initial?"Edit Stock Item":"Add Stock Item"} onClose={onClose}>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <Inp label="Item Name" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Vitrified Tiles 600x600"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
        <Sel label="Category" value={f.category} onChange={e=>{set("category",e.target.value);set("subcategory","");set("brand","");}}>
          <option value="">Select…</option>
          {stockCategories.map(c=><option key={c.id}>{c.name}</option>)}
        </Sel>
        <Sel label="Subcategory" value={f.subcategory} onChange={e=>{set("subcategory",e.target.value);set("brand","");}}>
          <option value="">Select…</option>
          {(cat?.subs||[]).map(s=><option key={s.id}>{s.name}</option>)}
        </Sel>
        <Sel label="Brand" value={f.brand} onChange={e=>set("brand",e.target.value)}>
          <option value="">Select…</option>
          {(sub?.brands||[]).map(b=><option key={b}>{b}</option>)}
        </Sel>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Sel label="Unit" value={f.unit} onChange={e=>set("unit",e.target.value)}>
          {STOCK_UNITS.map(u=><option key={u}>{u}</option>)}
        </Sel>
        <Inp label="Min Stock Level" hint="alert below this" type="number" value={f.minStock} onChange={e=>set("minStock",e.target.value)} placeholder="0"/>
      </div>
      <Inp label="Notes" as="textarea" value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="Any notes about this item…"/>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn v="subtle" onClick={onClose}>Cancel</Btn>
        <Btn onClick={()=>{if(f.name.trim())onSave({...f,id:f.id||uid()});}}>
          {initial?"Save Changes":"Add Item"}
        </Btn>
      </div>
    </div>
  </Modal>;
}

// ── Add Movement Form ──────────────────────────────────────────────────────────
function AddMovementForm({item,projects,onSave,onClose}){
  const [f,setF]=useState({type:"purchase",qty:"",date:today(),projectId:"",supplier:"",note:"",unit:item.unit});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const mt=MOVE_TYPES[f.type];
  const needsProject=f.type==="issue"||f.type==="return"||f.type==="direct";
  return <Modal title={`Add Movement — ${item.name}`} onClose={onClose}>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      {Object.entries(MOVE_TYPES).map(([key,val])=><button key={key} onClick={()=>set("type",key)} className="btn" style={{
        padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:600,fontFamily:FF.head,
        border:`1px solid ${f.type===key?val.color:T.border}`,
        background:f.type===key?val.color+"22":"rgba(255,255,255,0.8)",
        color:f.type===key?val.color:T.muted}}>
        {val.icon} {val.label}
      </button>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Inp label={`Quantity (${item.unit})`} type="number" value={f.qty} onChange={e=>set("qty",e.target.value)} placeholder="0"/>
        <Inp label="Date" type="date" value={f.date} onChange={e=>set("date",e.target.value)}/>
      </div>
      {needsProject&&<Sel label="Project" value={f.projectId} onChange={e=>set("projectId",e.target.value)}>
        <option value="">Select Project…</option>
        {projects.map(p=><option key={p.id} value={p.id}>{p.name} — {p.clientName}</option>)}
      </Sel>}
      {f.type==="purchase"&&<Inp label="Supplier Name" value={f.supplier} onChange={e=>set("supplier",e.target.value)} placeholder="Supplier / vendor name"/>}
      <Inp label="Note" value={f.note} onChange={e=>set("note",e.target.value)} placeholder="Optional note…"/>
      {f.qty&&<div style={{background:mt.color+"11",border:`1px solid ${mt.color}33`,borderRadius:8,padding:"10px 14px",fontSize:13,color:mt.color,fontWeight:600}}>
        {mt.icon} {mt.label}: {f.qty} {item.unit}
        {needsProject&&f.projectId&&` → ${projects.find(p=>p.id===f.projectId)?.name||""}`}
      </div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn v="subtle" onClick={onClose}>Cancel</Btn>
        <Btn onClick={()=>{if(f.qty&&Number(f.qty)>0)onSave({id:uid(),itemId:item.id,itemName:item.name,...f,qty:Number(f.qty)});}}>Save Movement</Btn>
      </div>
    </div>
  </Modal>;
}

// ── Stock Page ─────────────────────────────────────────────────────────────────
function StockPage({stockItems,stockMovements,stockCategories,projects,team,currentUser,onUpdateItems,onUpdateMovements,onUpdateCategories}){  const [showAddItem,setShowAddItem]=useState(false);
  const [showCatMgr,setShowCatMgr]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const [moveItem,setMoveItem]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const [filterCat,setFilterCat]=useState("All");
  const [search,setSearch]=useState("");

  // Check if user can manage categories (owner or site supervisor)
  const member=team.find(m=>m.id===currentUser);
  const canManage=currentUser==="owner"||(member&&member.role==="Site Supervisor");

  // Calculate balance for each item
  const getBalance=(itemId)=>{
    return stockMovements.filter(m=>m.itemId===itemId).reduce((bal,m)=>{
      const mt=MOVE_TYPES[m.type];
      return bal+(mt?mt.sign*m.qty:0);
    },0);
  };

  const getProjectConsumption=(itemId)=>{
    const issued=stockMovements.filter(m=>m.itemId===itemId&&m.type==="issue");
    const returned=stockMovements.filter(m=>m.itemId===itemId&&m.type==="return");
    const byProject={};
    issued.forEach(m=>{
      const pName=projects.find(p=>p.id===m.projectId)?.name||"Unknown";
      byProject[pName]=(byProject[pName]||0)+m.qty;
    });
    returned.forEach(m=>{
      const pName=projects.find(p=>p.id===m.projectId)?.name||"Unknown";
      byProject[pName]=(byProject[pName]||0)-m.qty;
    });
    return Object.entries(byProject).sort((a,b)=>b[1]-a[1]);
  };

  const filtered=stockItems.filter(i=>{
    if(filterCat!=="All"&&i.category!==filterCat)return false;
    if(search&&!i.name.toLowerCase().includes(search.toLowerCase())&&!i.brand?.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  });

  const lowStock=stockItems.filter(i=>i.minStock&&getBalance(i.id)<Number(i.minStock));

  const saveItem=(item)=>{
    const raw=stockItems.find(x=>x.id===item.id)?stockItems.map(x=>x.id===item.id?item:x):[...stockItems,item];
    const seen=new Set();
    const items=raw.filter(x=>{if(!x.id||seen.has(String(x.id)))return false;seen.add(String(x.id));return true;});
    onUpdateItems(items);setShowAddItem(false);setEditItem(null);
  };
  const delItem=(id)=>onUpdateItems(stockItems.filter(i=>i.id!==id));
  const saveMovement=(move)=>{
    const raw=[...stockMovements,move];
    const seen=new Set();
    const moves=raw.filter(x=>{if(!x.id||seen.has(String(x.id)))return false;seen.add(String(x.id));return true;});
    onUpdateMovements(moves);setMoveItem(null);
  };

  return <div style={{padding:"20px 24px 40px"}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{fontSize:20,fontWeight:800,fontFamily:FF.head,color:T.text}}>Stock Register</div>
        <div style={{fontSize:13,color:T.muted}}>{stockItems.length} items · {stockMovements.length} movements</div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {canManage&&<Btn v="subtle" sm onClick={()=>setShowCatMgr(true)}>📂 Categories</Btn>}
        <Btn sm onClick={()=>setShowAddItem(true)}>+ Add Item</Btn>
      </div>
    </div>

    {/* Low stock alerts */}
    {lowStock.length>0&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:12,padding:"12px 16px",marginBottom:16}}>
      <div style={{fontSize:13,fontWeight:700,color:T.red,marginBottom:8}}>⚠ Low Stock Alert — {lowStock.length} item{lowStock.length>1?"s":""}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {lowStock.map(i=><div key={i.id} style={{background:"white",border:"1px solid #FECACA",borderRadius:7,padding:"5px 12px",fontSize:12,color:T.red}}>
          {i.name} — {getBalance(i.id)} {i.unit} (min: {i.minStock})
        </div>)}
      </div>
    </div>}

    {/* Summary cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
      {[
        {l:"Total Items",v:stockItems.length,c:T.text,icon:"📦"},
        {l:"Low Stock",v:lowStock.length,c:lowStock.length>0?T.red:T.green,icon:"⚠️"},
        {l:"Total Purchases",v:stockMovements.filter(m=>m.type==="purchase").length,c:T.green,icon:"📥"},
        {l:"Total Issues",v:stockMovements.filter(m=>m.type==="issue").length,c:T.red,icon:"📤"},
      ].map(s=><div key={s.l} className="fu" style={{background:"rgba(255,255,255,0.9)",border:`1px solid ${T.border}`,borderRadius:12,padding:"14px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
          <span>{s.icon}</span>
          <span style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",fontFamily:FF.head}}>{s.l}</span>
        </div>
        <div style={{fontSize:20,fontWeight:800,color:s.c,fontFamily:FF.head}}>{s.v}</div>
      </div>)}
    </div>

    {/* Filters */}
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search items or brands…" className="inp"
        style={{background:"rgba(255,255,255,0.9)",border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 14px",color:T.text,fontSize:13,width:220}}/>
      {["All",...stockCategories.map(c=>c.name)].map(c=><button key={c} className="btn" onClick={()=>setFilterCat(c)} style={{
        padding:"7px 13px",borderRadius:8,fontSize:12,fontWeight:600,fontFamily:FF.head,cursor:"pointer",
        border:`1px solid ${filterCat===c?T.gold:T.border}`,
        background:filterCat===c?"rgba(184,134,11,0.1)":"rgba(255,255,255,0.7)",
        color:filterCat===c?T.gold:T.muted}}>{c}</button>)}
    </div>

    {/* Stock Items Grid */}
    {filtered.length===0?<div style={{textAlign:"center",padding:"60px 20px"}}>
      <div style={{fontSize:48,marginBottom:12}}>📦</div>
      <div style={{fontFamily:FF.head,fontSize:18,color:T.muted,marginBottom:16}}>No stock items yet</div>
      <Btn onClick={()=>setShowAddItem(true)}>+ Add First Item</Btn>
    </div>:<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
      {filtered.map((item,i)=>{
        const bal=getBalance(item.id);
        const isLow=item.minStock&&bal<Number(item.minStock);
        const topProject=getProjectConsumption(item.id)[0];
        const moves=stockMovements.filter(m=>m.itemId===item.id);
        return <div key={item.id} className="hov fu" style={{background:"rgba(255,255,255,0.92)",border:`1px solid ${isLow?T.red+"66":T.border}`,borderRadius:14,padding:18,animationDelay:`${i*.04}s`}}>
          {/* Item header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{flex:1,paddingRight:8}}>
              <div style={{fontSize:15,fontWeight:800,color:T.text,fontFamily:FF.head,lineHeight:1.3}}>{item.name}</div>
              <div style={{fontSize:12,color:T.muted,marginTop:3}}>
                {[item.category,item.subcategory,item.brand].filter(Boolean).join(" → ")}
              </div>
            </div>
            {isLow&&<Pill label="Low Stock" color={T.red}/>}
          </div>

          {/* Balance */}
          <div style={{background:isLow?"#FEF2F2":"rgba(184,134,11,0.08)",borderRadius:10,padding:"12px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Current Balance</div>
              <div style={{fontSize:26,fontWeight:800,fontFamily:FF.head,color:isLow?T.red:T.gold}}>{bal} <span style={{fontSize:14,fontWeight:400}}>{item.unit}</span></div>
            </div>
            {item.minStock&&<div style={{textAlign:"right"}}>
              <div style={{fontSize:11,color:T.muted,marginBottom:3}}>Min Level</div>
              <div style={{fontSize:16,fontWeight:700,color:T.muted}}>{item.minStock} {item.unit}</div>
            </div>}
          </div>

          {/* Quick stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10}}>
            {[
              {l:"Purchased",v:moves.filter(m=>m.type==="purchase").reduce((a,m)=>a+m.qty,0),c:T.green},
              {l:"Issued",v:moves.filter(m=>m.type==="issue"||m.type==="direct").reduce((a,m)=>a+m.qty,0),c:T.red},
              {l:"Returned",v:moves.filter(m=>m.type==="return").reduce((a,m)=>a+m.qty,0),c:T.blue},
            ].map(s=><div key={s.l} style={{background:T.faint,borderRadius:7,padding:"6px 8px",textAlign:"center"}}>
              <div style={{fontSize:9,color:T.muted,marginBottom:2,textTransform:"uppercase"}}>{s.l}</div>
              <div style={{fontSize:13,fontWeight:700,color:s.c}}>{s.v} {item.unit}</div>
            </div>)}
          </div>

          {/* Top project */}
          {topProject&&<div style={{fontSize:12,color:T.muted,marginBottom:10}}>
            🏗 Most used: <span style={{color:T.text,fontWeight:600}}>{topProject[0]}</span> ({topProject[1]} {item.unit})
          </div>}

          {/* Actions */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <Btn sm onClick={()=>setMoveItem(item)} style={{flex:1}}>+ Movement</Btn>
            <Btn v="subtle" sm onClick={()=>setDetailItem(item)}>History</Btn>
            <Btn v="subtle" sm onClick={()=>setEditItem(item)}>✏</Btn>
            <Btn v="danger" sm onClick={()=>{if(window.confirm(`Delete ${item.name}?`))delItem(item.id);}}>🗑</Btn>
          </div>
        </div>;
      })}
    </div>}

    {/* Item Detail / History Modal */}
    {detailItem&&<Modal title={`📦 ${detailItem.name} — History`} onClose={()=>setDetailItem(null)} wide>
      <div style={{marginBottom:14,display:"flex",gap:8,flexWrap:"wrap"}}>
        {[detailItem.category,detailItem.subcategory,detailItem.brand].filter(Boolean).map((v,i)=><Pill key={i} label={v} color={T.purple}/>)}
        <Pill label={`Balance: ${getBalance(detailItem.id)} ${detailItem.unit}`} color={T.gold}/>
      </div>

      {/* Project consumption */}
      {getProjectConsumption(detailItem.id).length>0&&<div style={{background:"rgba(255,255,255,0.9)",border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px",marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:T.text,fontFamily:FF.head,marginBottom:10}}>Project-wise Consumption</div>
        {getProjectConsumption(detailItem.id).map(([name,qty])=><div key={name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <span style={{fontSize:13,color:T.text,flex:1,fontWeight:600}}>🏗 {name}</span>
          <div style={{flex:1}}><Bar v={qty} max={Math.max(...getProjectConsumption(detailItem.id).map(x=>x[1]))} color={T.gold}/></div>
          <span style={{fontSize:13,fontWeight:700,color:T.red,minWidth:70,textAlign:"right"}}>{qty} {detailItem.unit}</span>
        </div>)}
      </div>}

      {/* Movement history */}
      <div style={{maxHeight:340,overflowY:"auto"}}>
        {stockMovements.filter(m=>m.itemId===detailItem.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(m=>{
          const mt=MOVE_TYPES[m.type];
          const proj=projects.find(p=>p.id===m.projectId);
          return <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"rgba(255,255,255,0.8)",borderRadius:8,marginBottom:6,border:`1px solid ${T.border}`}}>
            <span style={{fontSize:18}}>{mt?.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600,color:T.text}}>{mt?.label}</div>
              <div style={{fontSize:11,color:T.muted}}>
                {proj&&`→ ${proj.name}`}
                {m.supplier&&`From: ${m.supplier}`}
                {m.note&&` · ${m.note}`}
              </div>
            </div>
            <span style={{fontSize:11,color:T.muted}}>{m.date}</span>
            <span style={{fontSize:14,fontWeight:700,color:mt?.color,minWidth:70,textAlign:"right"}}>
              {mt?.sign===1?"+":(mt?.sign===-1?"-":"→")}{m.qty} {detailItem.unit}
            </span>
            <button onClick={()=>{if(window.confirm("Delete this movement?"))(()=>{const filtered=stockMovements.filter(x=>String(x.id)!==String(m.id));const seen=new Set();onUpdateMovements(filtered.filter(x=>{if(!x.id||seen.has(String(x.id)))return false;seen.add(String(x.id));return true;}));})();}} className="btn" style={{background:"none",border:"none",color:T.red,fontSize:13}}>🗑</button>
          </div>;
        })}
        {stockMovements.filter(m=>m.itemId===detailItem.id).length===0&&<p style={{color:T.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>No movements yet.</p>}
      </div>
    </Modal>}

    {showAddItem&&<AddStockItemForm stockCategories={stockCategories} onSave={saveItem} onClose={()=>setShowAddItem(false)}/>}
    {editItem&&<AddStockItemForm stockCategories={stockCategories} initial={editItem} onSave={saveItem} onClose={()=>setEditItem(null)}/>}
    {moveItem&&<AddMovementForm item={moveItem} projects={projects} onSave={saveMovement} onClose={()=>setMoveItem(null)}/>}
    {showCatMgr&&<StockCatManager cats={stockCategories} onSave={cats=>{onUpdateCategories(cats);setShowCatMgr(false);}} onClose={()=>setShowCatMgr(false)}/>}
  </div>;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
